{{- define "newapi.applicationStatefulSet" -}}
{{- $root := .root -}}
{{- $name := .name -}}
{{- $role := .role -}}
{{- $replicas := .replicas -}}
{{- $needsPvc := eq (include "newapi.needsPVC" $root) "true" -}}
{{- $imageTag := default $root.Chart.AppVersion $root.Values.image.tag -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app: {{ include "newapi.name" $root }}
    component: application
    role: {{ $role }}
spec:
  serviceName: {{ include "newapi.headlessServiceName" $root }}
  replicas: {{ $replicas }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ include "newapi.name" $root }}
      component: application
      role: {{ $role }}
  template:
    metadata:
      labels:
        app: {{ include "newapi.name" $root }}
        component: application
        role: {{ $role }}
    spec:
      containers:
        - name: new-api
          image: "{{ $root.Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $root.Values.service.port }}
              protocol: TCP
          {{- $args := list -}}
          {{- range $root.Values.extraArgs }}
          {{- $args = append $args (printf "%v" .) -}}
          {{- end -}}
          {{- if $root.Values.mountLogs.enabled -}}
          {{- $args = append $args "--log-dir" -}}
          {{- $args = append $args (printf "%v" $root.Values.mountLogs.path) -}}
          {{- end -}}
          {{- if gt (len $args) 0 }}
          args:
          {{- range $args }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          env:
          {{- $envFromSecretName := default "" $root.Values.envFromSecret.name }}
          {{- $envFromSecretKeys := default (dict) $root.Values.envFromSecret.keys }}
          {{- range $k, $v := $root.Values.env }}
            {{- if and (ne $k "NODE_TYPE") (not (and (ne $envFromSecretName "") (hasKey $envFromSecretKeys $k))) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if ne $envFromSecretName "" }}
          {{- range $envName, $secretKey := $envFromSecretKeys }}
            {{- if ne $envName "NODE_TYPE" }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $envFromSecretName }}
                  key: {{ default $envName $secretKey }}
            {{- end }}
          {{- end }}
          {{- end }}
            - name: NODE_TYPE
              value: {{ $role | quote }}
          {{- if $root.Values.database.usePostgres }}
            {{- $dbHost := required "database.host is required when database.usePostgres=true" $root.Values.database.host }}
            {{- $dbPort := $root.Values.database.port | default 5432 }}
            {{- $dbName := $root.Values.database.database | default "newapi" }}
            {{- $dbParams := $root.Values.database.params | default "" }}
            {{- $dbUser := required "database.auth.username is required when database.usePostgres=true" $root.Values.database.auth.username }}
            {{- if $root.Values.database.auth.existingSecret.name }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newapi.database.authSecretName" $root }}
                  key: {{ include "newapi.database.authSecretKey" $root }}
            - name: SQL_DSN
              value: "postgresql://{{ $dbUser }}:$(DB_PASSWORD)@{{ $dbHost }}:{{ $dbPort }}/{{ $dbName }}{{- if $dbParams }}?{{ $dbParams }}{{- end }}"
            {{- else }}
            {{- $dbPassword := required "database.auth.password is required when database.auth.existingSecret.name is empty" $root.Values.database.auth.password }}
            - name: SQL_DSN
              value: "postgresql://{{ $dbUser }}:{{ $dbPassword }}@{{ $dbHost }}:{{ $dbPort }}/{{ $dbName }}{{- if $dbParams }}?{{ $dbParams }}{{- end }}"
            {{- end }}
          {{- end }}
          {{- $externalRedisConn := default "" (index $root.Values.env "REDIS_CONN_STRING") }}
          {{- $hasExternalRedisConn := ne $externalRedisConn "" }}
          {{- if $root.Values.redis.enabled }}
            {{- if $root.Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newapi.redis.authSecretName" $root }}
                  key: {{ include "newapi.redis.authSecretKey" $root }}
            - name: REDIS_CONN_STRING
              value: "{{ $root.Values.redis.scheme }}://:$(REDIS_PASSWORD)@{{ include "newapi.redis.serviceName" $root }}:{{ $root.Values.redis.service.port }}"
            {{- else }}
            - name: REDIS_CONN_STRING
              value: "{{ $root.Values.redis.scheme }}://{{ include "newapi.redis.serviceName" $root }}:{{ $root.Values.redis.service.port }}"
            {{- end }}
          {{- else }}
            {{- if not $hasExternalRedisConn }}
              {{- $addr := include "newapi.redis.externalAddress" $root }}
              {{- if $root.Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newapi.redis.authSecretName" $root }}
                  key: {{ include "newapi.redis.authSecretKey" $root }}
            - name: REDIS_CONN_STRING
              value: "{{ $root.Values.redis.scheme }}://:$(REDIS_PASSWORD)@{{ $addr }}"
              {{- else }}
            - name: REDIS_CONN_STRING
              value: "{{ $root.Values.redis.scheme }}://{{ $addr }}"
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $needsPvc }}
          volumeMounts:
            {{- if not $root.Values.database.usePostgres }}
            - name: app-storage
              mountPath: /data
              subPath: {{ $root.Values.paths.dataSubPath | quote }}
            {{- end }}
            {{- if $root.Values.mountLogs.enabled }}
            - name: app-storage
              mountPath: {{ $root.Values.mountLogs.path | quote }}
              subPath: {{ $root.Values.paths.logsSubPath | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml $root.Values.resources | indent 12 }}
      {{- if $needsPvc }}
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: {{ if $root.Values.persistence.existingClaim -}}
              {{ $root.Values.persistence.existingClaim | quote }}
            {{- else -}}
              {{ include "newapi.fullname" $root }}
            {{- end }}
      {{- end }}
{{- end -}}

{{- include "newapi.validate" . -}}
{{- if .Values.cluster.enabled }}
{{ include "newapi.applicationStatefulSet" (dict "root" . "name" (include "newapi.masterStatefulSetName" .) "role" "master" "replicas" .Values.cluster.master.replicas) }}
---
{{ include "newapi.applicationStatefulSet" (dict "root" . "name" (include "newapi.slaveStatefulSetName" .) "role" "slave" "replicas" .Values.cluster.slave.replicas) }}
{{- else }}
{{ include "newapi.applicationStatefulSet" (dict "root" . "name" (include "newapi.fullname" .) "role" "master" "replicas" .Values.replicaCount) }}
{{- end }}
