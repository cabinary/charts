{{- if .Values.updater.enabled }}
{{- $imageTag := default .Chart.AppVersion .Values.image.tag }}
{{- $imageRef := printf "%s:%s" .Values.image.repository $imageTag }}
{{- $rolloutTimeout := int (.Values.updater.rolloutTimeoutSeconds | default 300) }}
{{- $stsCount := ternary 2 1 .Values.cluster.enabled }}
{{- /* 每个 StatefulSet 最多经历一次更新 + 一次回滚，再留 120s 给 kubectl 调用本身 */}}
{{- $autoDeadline := add (mul $stsCount 2 $rolloutTimeout) 120 }}
{{- $deadline := .Values.updater.activeDeadlineSeconds | default $autoDeadline }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "newapi.updater.serviceAccountName" . }}
  labels:
    app: {{ include "newapi.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "newapi.updater.roleName" . }}
  labels:
    app: {{ include "newapi.name" . }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # kubectl rollout undo / history 需要读取 ControllerRevision
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    verbs: ["get", "list", "watch"]
  # 回滚时需要删除一直未 Ready 的 Pod，StatefulSet 才会用回退后的模板重建它
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "newapi.updater.roleBindingName" . }}
  labels:
    app: {{ include "newapi.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "newapi.updater.roleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "newapi.updater.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "newapi.updater.cronJobName" . }}
  labels:
    app: {{ include "newapi.name" . }}
spec:
  schedule: {{ required "updater.schedule is required when updater.enabled=true" .Values.updater.schedule | quote }}
  {{- $tz := default (default "Etc/UTC" (index .Values.env "TZ")) .Values.updater.timeZone }}
  timeZone: {{ $tz | quote }}
  concurrencyPolicy: {{ .Values.updater.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.updater.successfulJobsHistoryLimit | default 1 }}
  failedJobsHistoryLimit: {{ .Values.updater.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.updater.backoffLimit | default 0 }}
      activeDeadlineSeconds: {{ $deadline }}
      template:
        metadata:
          labels:
            app: {{ include "newapi.name" . }}
            component: updater
        spec:
          serviceAccountName: {{ include "newapi.updater.serviceAccountName" . }}
          restartPolicy: Never
          {{- $kubectlTag := default "latest" .Values.kubectl.image.tag }}
          containers:
            - name: updater
              image: "{{ .Values.kubectl.image.repository }}:{{ $kubectlTag }}"
              imagePullPolicy: {{ .Values.kubectl.image.pullPolicy }}
              {{- if .Values.kubectl.env }}
              env:
              {{- range $k, $v := .Values.kubectl.env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
              {{- end }}
              {{- end }}
              command:
                - /bin/sh
                - -ec
                - |
                  NAMESPACE="{{ .Release.Namespace }}"
                  TIMEOUT="{{ $rolloutTimeout }}s"
                  APP_LABEL="{{ include "newapi.name" . }}"
                  CONTAINER="new-api"
                  IMAGE_REPO="{{ .Values.image.repository }}"
                  IMAGE_REF="{{ $imageRef }}"

                  log() {
                    echo "[updater] $(date -u +%Y-%m-%dT%H:%M:%SZ) $*"
                  }

                  # 输出：<pod名>|<镜像 imageID>|<Ready 状态>，每行一个 Pod
                  pods_of() {
                    kubectl -n "$NAMESPACE" get pods \
                      -l "app=$APP_LABEL,component=application,role=$1" \
                      -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.containerStatuses[?(@.name=="new-api")].imageID}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
                  }

                  # 取一个 Ready Pod 当前实际运行的镜像 digest，作为回滚目标。
                  # 使用 latest 这类浮动 tag 时，rollout undo 回退的模板仍会拉到新镜像，
                  # 只有按 digest 钉住才是真正的回滚。
                  current_digest() {
                    pods_of "$1" | while IFS='|' read -r name image ready; do
                      [ "$ready" = "True" ] || continue
                      [ -n "$image" ] || continue
                      case "$image" in
                        *@*) echo "$image" ;;
                        *) echo "${IMAGE_REPO}@${image}" ;;
                      esac
                      break
                    done
                  }

                  # 一次 patch 同时改镜像和 restartedAt，只产生一个 ControllerRevision
                  set_template_image() {
                    kubectl -n "$NAMESPACE" patch "statefulset/$1" --type strategic \
                      -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$3\"}},\"spec\":{\"containers\":[{\"name\":\"$CONTAINER\",\"image\":\"$2\"}]}}}}"
                  }

                  # StatefulSet 不会替换一个从未 Ready 的 Pod（OrderedReady 会卡住整个更新），
                  # 官方 Forced Rollback 流程要求手动删除它，控制器才会用回退后的模板重建。
                  delete_unready_pods() {
                    pods_of "$1" | while IFS='|' read -r name image ready; do
                      [ -n "$name" ] || continue
                      [ "$ready" = "True" ] && continue
                      log "deleting not-ready pod $name so the StatefulSet controller recreates it"
                      kubectl -n "$NAMESPACE" delete pod "$name" --wait=false --ignore-not-found
                    done
                  }

                  rollout_statefulset() {
                    name="$1"
                    role="$2"
                    previous="$(current_digest "$role" || true)"
                    now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

                    if [ -n "$previous" ]; then
                      log "$name: currently running $previous"
                    else
                      log "$name: no Ready pod found, digest rollback unavailable; will fall back to rollout undo"
                    fi

                    # 同时把可能被上次回滚钉住的 digest 恢复成浮动 tag
                    log "$name: restarting with image $IMAGE_REF"
                    set_template_image "$name" "$IMAGE_REF" "$now"
                    if kubectl -n "$NAMESPACE" rollout status "statefulset/$name" --timeout="$TIMEOUT"; then
                      log "$name: rollout finished"
                      return 0
                    fi

                    log "$name: rollout did not finish within $TIMEOUT, rolling back"
                    if [ -n "$previous" ]; then
                      set_template_image "$name" "$previous" "$now"
                    else
                      kubectl -n "$NAMESPACE" rollout undo "statefulset/$name"
                    fi
                    delete_unready_pods "$role"
                    if kubectl -n "$NAMESPACE" rollout status "statefulset/$name" --timeout="$TIMEOUT"; then
                      log "$name: rolled back to ${previous:-previous revision}"
                    else
                      log "$name: rollback did not finish within $TIMEOUT, manual intervention required"
                    fi
                    return 1
                  }

                  {{- if .Values.cluster.enabled }}
                  # 主节点先完成迁移并稳定运行，再更新从节点；master 失败则不碰 slave。
                  rollout_statefulset "{{ include "newapi.masterStatefulSetName" . }}" master || {
                    log "master update failed, slave StatefulSet left untouched"
                    exit 1
                  }
                  rollout_statefulset "{{ include "newapi.slaveStatefulSetName" . }}" slave || exit 1
                  {{- else }}
                  rollout_statefulset "{{ include "newapi.fullname" . }}" master || exit 1
                  {{- end }}
                  log "all StatefulSets updated"
{{- end }}
